version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: invoice-postgres
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: invoice_admin
      POSTGRES_PASSWORD: invoice_password_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_admin -d invoice_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invoice-network

  # FastAPI Backend
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: invoice-fastapi
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://invoice_admin:invoice_password_admin@postgres:5432/invoice_db
      
      # Gemini API Key (replace with your actual key)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # Application Settings
      DEBUG: "True"
      ENVIRONMENT: development
      
      # Storage Settings
      UPLOAD_DIR: /app/uploads
      REPORTS_DIR: /app/reports
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - invoice-network
    restart: unless-stopped

  # Streamlit Frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: invoice-streamlit
    environment:
      API_BASE_URL: http://fastapi:8000
    volumes:
      - ./streamlit_app:/app
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - invoice-network
    restart: unless-stopped

  # MinIO for S3-compatible object storage (Optional - for future AWS S3 migration)
  minio:
    image: minio/minio:latest
    container_name: invoice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - invoice-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  invoice-network:
    driver: bridge